or="start"><tspan x="-212.4" dy="13">(b) Alarm buzzer: D9</tspan></text><text x="108.0" y="136.6" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="108.0" dy="11">+5V_SYS</tspan></text><text x="99.0" y="197.79999999999998" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="99.0" dy="11">BZ1  5 V active buzzer</tspan></text><text x="124.14" y="259.18" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="124.14" dy="11">Q3  BC547 / 2N3904</tspan></text><text x="34.139999999999986" y="239.07999999999996" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="34.139999999999986" dy="11">R8  1 kΩ</tspan></text><text x="-219.6" y="325.67999999999995" dominant-baseline="central" fill="#555555" font-size="9" font-family="sans" text-anchor="start"><tspan x="-219.6" dy="9">Fit a 1N4148 across BZ1 if it is a magnetic (coil) buzzer.</tspan></text><text x="-219.6" y="375.67999999999995" dominant-baseline="central" fill="black" font-size="13" font-family="sans" text-anchor="start"><tspan x="-219.6" dy="13">(c) Optional aerator relay: D8 (mains side by an electrician)</tspan></text><text x="27.0" y="493.47999999999996" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="start"><tspan x="27.0" dy="14">IN</tspan></text><text x="145.79999999999998" y="493.47999999999996" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="end"><tspan x="145.79999999999998" dy="14">NO/COM</tspan></text><text x="86.39999999999999" y="431.47999999999996" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="86.39999999999999" dy="11">Opto-isolated relay / SSR</tspan><tspan x="86.39999999999999" dy="11">(3.3 V-logic input)</tspan></text><text x="-212.4" y="566.8799999999999" dominant-baseline="central" fill="#555555" font-size="9" font-family="sans" text-anchor="start"><tspan x="-212.4" dy="9">Module VCC → +5V_SYS, GND → GND. Use a contactor rated for the aerator motor's inrush current.</tspan></text><circle cx="-72" cy="-136.8" r="2.7" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><text x="-78.3" y="-147.79999999999998" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="-78.3" dy="11">Qwiic SDA (PD13)</tspan></text><circle cx="-72" cy="-100.8" r="2.7" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><text x="-78.3" y="-111.8" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="-78.3" dy="11">Qwiic SCL (PD12)</tspan></text><circle cx="-72" cy="-64.8" r="2.7" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><text x="-78.3" y="-75.8" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="-78.3" dy="11">Qwiic +3V3</tspan></text><circle cx="-72" cy="-28.8" r="2.7" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><text x="-78.3" y="-39.8" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="-78.3" dy="11">Qwiic GND</tspan></text><circle cx="223.2" cy="-100.8" r="2.7" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><text x="229.5" y="-111.8" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="229.5" dy="11">DS18B20 DQ (yellow)</tspan></text><circle cx="223.2" cy="-64.8" r="2.7" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><text x="229.5" y="-75.8" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="229.5" dy="11">DS18B20 GND (black)</tspan></text><circle cx="-12.66" cy="262.68" r="2.7" style=