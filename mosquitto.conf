# Mosquitto config for local testing only: no login and no TLS.
# Do not expose this broker to the internet.
#   docker run -it -p 1883:1883 -p 9001:9001 -v "$PWD/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2

# MQTT for the app (paho-mqtt)
listener 1883

# MQTT over WebSockets for dashboard/index.html in the browser
listener 9001
protocol websockets

allow_anonymous true
