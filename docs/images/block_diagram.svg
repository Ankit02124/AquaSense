<path d="M1030,340 L1060,340" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1060,340 L1050.8,343.9 L1050.8,336.1 Z" fill="#2a78d6"/>
<rect x="250" y="490" width="330" height="96" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="264" y="514" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">Measurement state machine</text>
<text x="264" y="534.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">one probe at a time: power → warm-up →</text>
<text x="264" y="551.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">64× oversample → power off (no cross-talk)</text>
<rect x="610" y="490" width="300" height="96" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="624" y="514" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">RPC API (Arduino_RouterBridge)</text>
<text x="624" y="534.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">aq_start(mask), aq_status, aq_result</text>
<text x="624" y="551.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">aq_indicator, aq_buzzer, aq_aerator</text>
<rect x="940" y="490" width="260" height="96" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="954" y="514" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">Fail-safes</text>
<text x="954" y="534.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">rails OFF at boot / reset</text>
<text x="954" y="551.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">60 s max rail-on, link LED</text>
<path d="M1300,250 L1300,470 L800,470 L800,490" fill="none" stroke="#d03b3b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
