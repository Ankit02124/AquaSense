<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>AquaSense block diagram</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="42" font-size="22" text-anchor="start" font-weight="700" fill="#1d1d1b">AquaSense - block diagram</text>
<text x="30" y="66" font-size="13" text-anchor="start" font-weight="normal" fill="#55534e">What runs where on the Arduino UNO Q, and how a camera alert turns into a probe reading.</text>
<rect x="20" y="90" width="1360" height="330" rx="14" fill="#f7fbff" stroke="#bcd3ea" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="36" y="114" font-size="13" text-anchor="start" font-weight="700" fill="#2a5f93">Linux MPU, Qualcomm QRB2210, Python (app/python)</text>
<rect x="20" y="440" width="1360" height="160" rx="14" fill="#f4faf5" stroke="#b9dcc0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="36" y="464" font-size="13" text-anchor="start" font-weight="700" fill="#2e7d32">Real-time MCU, STM32U585, Zephyr (app/sketch)</text>
<rect x="20" y="620" width="1360" height="120" rx="14" fill="#fffaf0" stroke="#ecd3a2" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="36" y="644" font-size="13" text-anchor="start" font-weight="700" fill="#9a6b13">Pond hardware</text>
<rect x="40" y="130" width="180" height="120" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="54" y="154" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">USB camera</text>
<text x="54" y="174.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">640x480 frames</text>
<text x="54" y="191.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">3 fps to the model</text>
<text x="54" y="208.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">fish_detector.py</text>
<rect x="250" y="130" width="230" height="120" rx="10" fill="#eef4ff" stroke="#7aa2d8" stroke-width="1.5"/>
<text x="264" y="154" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">YOLOv8n (ONNX)</text>
<text x="264" y="174.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">trained on Brackish dataset</text>
<text x="264" y="191.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">416 px input, onnxruntime</text>
<text x="264" y="208.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">fish, crab, shrimp, ...</text>
<rect x="510" y="130" width="250" height="120" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="524" y="154" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">Centroid tracker</text>
<text x="524" y="174.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">matches fish frame to frame</text>
<text x="524" y="191.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">speed in body lengths / s</text>
<text x="524" y="208.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">tracker.py</text>
<rect x="790" y="130" width="240" height="120" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="804" y="154" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">Behaviour checks</text>
<text x="804" y="174.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">10 s windows vs learned normal</text>
<text x="804" y="191.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">surface crowding, low activity,</text>
<text x="804" y="208.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">missing / still fish, green water</text>
<rect x="1060" y="130" width="260" height="120" rx="10" fill="#fff3f3" stroke="#e09a9a" stroke-width="1.5"/>
<text x="1074" y="154" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">Controller</text>
<text x="1074" y="174.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">2 windows in a row -&gt; measure</text>
<text x="1074" y="191.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">05:00 / 15:00 schedule</text>
<text x="1074" y="208.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">follow-up, cool-down</text>
<rect x="40" y="280" width="180" height="120" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="54" y="304" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">probes.py</text>
<text x="54" y="324.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">Bridge calls to the MCU</text>
<text x="54" y="341.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">start, poll, read result</text>
<text x="54" y="358.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">raw mV + temperature</text>
<rect x="250" y="280" width="230" height="120" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="264" y="304" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">chemistry.py</text>
<text x="264" y="324.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">pH (Nernst), DO (Benson-Krause</text>
<text x="264" y="341.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">T/S/altitude), EC -&gt; PSS-78</text>
<text x="264" y="358.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">salinity, turbidity, NH3 %</text>
<rect x="510" y="280" width="250" height="120" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="524" y="304" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">water_check.py</text>
<text x="524" y="324.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">species limits (tilapia, carp,</text>
<text x="524" y="341.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">pangasius, vannamei shrimp)</text>
<text x="524" y="358.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">OK / WARNING / CRITICAL + advice</text>
<rect x="790" y="280" width="240" height="120" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="804" y="304" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">datalog.py</text>
<text x="804" y="324.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">measurements.csv</text>
<text x="804" y="341.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">behaviour.csv, events.csv</text>
<text x="804" y="358.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">snapshots of alerts</text>
<rect x="1060" y="280" width="220" height="120" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="1074" y="304" font-size="14" text-anchor="start" font-weight="700" fill="#1d1d1b">Outputs</text>
<text x="1074" y="324.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">LED3 colour = water status</text>
<text x="1074" y="341.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">buzzer on CRITICAL</text>
<text x="1074" y="358.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#55534e">aerator relay (optional)</text>
